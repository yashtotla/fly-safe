# fly.toml app configuration file generated for fly-safe-api on 2026-07-13T06:26:09+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-safe-api'
primary_region = 'sin'

[build]
[env]
  # Ephemeral SQLite on the machine's own disk (no persistent volume). The snapshot
  # is a disposable cache that repopulates from sources on each boot/poll.
  DATABASE_URL = 'sqlite+aiosqlite:////tmp/flysafe.db'
  POLL_ENABLED = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
