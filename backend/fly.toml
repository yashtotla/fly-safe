# fly.toml app configuration file generated for fly-safe-api on 2026-07-13T06:26:09+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-safe-api'
primary_region = 'bom'

[build]
[env]
  DATABASE_URL = 'sqlite+aiosqlite:////data/flysafe.db'
  POLL_ENABLED = 'true'

[[mounts]]
  source = 'flysafe_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
