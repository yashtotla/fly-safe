<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fly-safe">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
  </defs>

  <!-- calm 'all-clear' backdrop with a soft glow -->
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>

  <!-- ears (behind head) -->
  <ellipse cx="16" cy="38" rx="6.5" ry="12" fill="#7c4a1e"/>
  <ellipse cx="48" cy="38" rx="6.5" ry="12" fill="#7c4a1e"/>

  <!-- head -->
  <rect x="17" y="23" width="30" height="31" rx="15" fill="#e7c496"/>

  <!-- snout + nose + calm closed eyes -->
  <ellipse cx="32" cy="46" rx="9" ry="7" fill="#f2dcb2"/>
  <ellipse cx="32" cy="43" rx="3.1" ry="2.3" fill="#2b1d12"/>
  <path d="M22 38 q3.2 3.4 6.4 0" stroke="#2b1d12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M35.6 38 q3.2 3.4 6.4 0" stroke="#2b1d12" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- aviator cap -->
  <path d="M15 30 a17 15 0 0 1 34 0 z" fill="#5a3a1c"/>
  <rect x="14" y="27" width="36" height="5.5" rx="2.75" fill="#472c14"/>

  <!-- goggles pushed up on the cap -->
  <rect x="28" y="22" width="8" height="4" rx="2" fill="#2b1d12"/>
  <circle cx="24" cy="24" r="6.2" fill="#fcd34d" stroke="#2b1d12" stroke-width="2.2"/>
  <circle cx="40" cy="24" r="6.2" fill="#fcd34d" stroke="#2b1d12" stroke-width="2.2"/>
  <circle cx="24" cy="24" r="2.4" fill="#fef3c7"/>
  <circle cx="40" cy="24" r="2.4" fill="#fef3c7"/>
</svg>
